name: Release

on:
  push:
    branches: ["main"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: dexwritescode/release-on-merge-action@v1.2.0
        id: release
        with:
          initial-version: '0.1.0'
          version-increment-strategy: patch
          generate-release-notes: true
          use-label-strategy: true
          label-major: 'release:major'
          label-minor: 'release:minor'
          label-patch: 'release:patch'
          label-skip: 'release:skip'

      - uses: actions/checkout@v7

      - name: Check a release was made for this commit
        id: made
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -n "$TAG" ] && git ls-remote --tags origin "$TAG" "$TAG^{}" | grep -q "^$GITHUB_SHA"; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the next -dev version PR
        if: steps.made.outputs.yes == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/next-dev.sh
