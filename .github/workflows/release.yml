name: Release

# Each merged PR releases, sized by its release:* label. The action commits the
# release version to Cargo.toml (tagged), then the next -dev version, and pushes
# both to main with the release App's token (a bypass actor on main's ruleset).

on:
  push:
    branches: ["main"]

jobs:
  release:
    # Skip the action's own push, so it never joins the group and cancels a waiting release.
    if: ${{ !startsWith(github.event.head_commit.message, 'Next development version') }}
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: dexwritescode/release-on-merge-action@v1.3.0
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        with:
          initial-version: '0.1.0'
          version-increment-strategy: patch
          generate-release-notes: true
          use-label-strategy: true
          label-major: 'release:major'
          label-minor: 'release:minor'
          label-patch: 'release:patch'
          label-skip: 'release:skip'
          version-files: cargo
