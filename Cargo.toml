[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.3-dev"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal crates
axon-protocol = { path = "crates/axon-protocol" }
axon-core = { path = "crates/axon-core" }
axon-config = { path = "crates/axon-config" }
axon-acp = { path = "crates/axon-acp" }
axon-tui = { path = "crates/axon-tui" }

# external
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
humantime = "2"
unicode-width = "0.2"
async-openai = { version = "0.42", features = ["chat-completion", "byot"] }
futures = "0.3"
agent-client-protocol = { version = "3", features = ["stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
anyhow = "1"
thiserror = "2"
wiremock = "0.6"
ignore = "0.4"
globset = "0.4"
regex = "1"
similar = { version = "3", features = ["inline"] }
syntect = "5"
two-face = "0.5"
tempfile = "3"
uuid = { version = "1", features = ["v7", "serde"] }
semver = "1"
tokio-util = "0.7"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
