[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal crates
axon-protocol = { path = "crates/axon-protocol" }
axon-core = { path = "crates/axon-core" }
axon-acp = { path = "crates/axon-acp" }
axon-tui = { path = "crates/axon-tui" }

# external
async-openai = "0.42" # {path = "../../async-openai", features = ["chat-completion"]}
futures = "0.3" # for async-openai streaming check chat-stream example
agent-client-protocol = { version = "3", features = ["stdio"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
