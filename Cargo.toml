[package]
name = "axon"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = "0.42" # {path = "../../async-openai", features = ["chat-completion"]}
futures = "0.3" # for async-openai streaming check chat-stream example
agent-client-protocol = { version = "3", features = ["stdio"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
