[package]
name = "axon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-openai = { version = "0.38.0", features = ["chat-completion", "model"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
eventsource-stream = "0.2.3"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3.32"
similar = "2"
syntect = "5"
two-face = "0.4"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
